<!DOCTYPE html>

<html>
    <head>
        <title>Cafeteria</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="css/InicioSesion.css">
    </head>
    <body>
        
        <!--HEADER-->
        
    <header class='cabeza'>
        <img  class='logo' src="Image/LogoSF.png" alt="Logo de la cafetería">
    </header>
        
        
        <!--MAIN-->    
        
    <div class="login_container">

        <h1 class="login_title">Iniciar Sesión</h1>

        <form action="iniciar_sesion.jsp" method="post">

            <input 
                type="text" 
                name="matricula"
                class="login_input" 
                placeholder="Matrícula / ID de trabajador"
            >

            <input 
                type="text" 
                name="contrasena"
                class="login_input"
                placeholder="Contraseña (NIP)"
            >

            <button type="submit" class="login_button">
                Acceder
            </button>

        </form>

        <p class="login_register">
            ¿No tienes cuenta?  
            <a href="registro.jsp">Regístrate aquí</a>
        </p>

    </div>

        
        <!--FOOTER--> 
        
    <footer class="footer">
        


        <div class="footer_left">
            <p class="text-up">© 2025 Cafeterìa Universitaria BUAP -Todos los derechos reservados</p>
            <p class="text-down">Desarrollado por estudiantes de la Facultad Ciencias de la Computación</p>
        </div>
        

        <div class="footer_right">
            
            <div class="social_icons">
                <p class="fab fa-facebook-f">
                    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-brand-facebook"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 10v4h3v7h4v-7h3l1 -4h-4v-2a1 1 0 0 1 1 -1h3v-4h-3a5 5 0 0 0 -5 5v2h-3" /></svg>
                </p>

                <p  class="fab fa-instagram">
                    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-brand-instagram"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 8a4 4 0 0 1 4 -4h8a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-8a4 4 0 0 1 -4 -4z" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M16.5 7.5v.01" /></svg>
                </p>
            </div>

        </div>


    </footer>
        
        
        
        
    </body>
</html>
